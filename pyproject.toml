[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seshat"
version = "0.1.0"
description = "Scripts for Extraction, Synchronisation, HPI + Analog alignment and Transfer"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0.0",
    "matplotlib>=3.5.0",
    "mne>=1.5.0",
    "mne-bids>=0.13.0",
    "tqdm>=4.64.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
]
# The 'opm_utility_scripts' git submodule (used by seshat/stages/opm_preprocess.py)
# is not published to PyPI and is intentionally NOT listed here. install.sh installs
# it directly from the local submodule checkout (in editable mode) alongside seshat.
# It brings its own dependencies (scipy, plus numpy/matplotlib/mne already listed above).
# Developers running `pip install -e .` by hand instead of install.sh must also run:
#   pip install -e opm_utility_scripts/

[project.optional-dependencies]
gui = [
    # `seshat gui` and the interactive file-dialog fallbacks in seshat/utils.py
    # (askdirectory/askForConfig) use PySide6. Unlike Tkinter, Qt ships as a
    # prebuilt pip wheel, so no OS-level package install is needed:
    #   pip install seshat[gui]
    #
    # IMPORTANT: do not make this a core/unconditional dependency. pip's
    # PySide6 wheel bundles its own private copy of the Qt libraries. In a
    # conda/mamba environment that already provides Qt as a conda package
    # (e.g. conda-forge's qtbase, often pulled in transitively by mne/PyQt6),
    # having both a conda Qt build and pip's bundled Qt build loaded in the
    # same process crashes with "Cannot mix incompatible Qt library (X)
    # with this library (Y). Aborted (core dumped)". Keeping this as an
    # opt-in extra means a plain `pip install -e .` into an existing
    # conda dev environment never risks pulling in a conflicting Qt copy;
    # install.sh installs this extra only into its own isolated uv/pipx
    # tool environment, which doesn't share site-packages with conda.
    "pyside6>=6.6",
]
notebook = [
    "jupyter>=1.0.0",
    "ipython>=8.0.0",
    "seaborn>=0.12.0",
]

[project.scripts]
seshat = "seshat.cli:main"
natmeg = "seshat.cli:natmeg_compat"

[tool.setuptools.packages.find]
where = ["."]
include = ["seshat*"]
